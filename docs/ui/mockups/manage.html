<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AriaDesk - 管理页 UI 稿</title>
<style>
  :root {
    --brand: #2E62F6;
    --brand-hover: #2553D8;
    --brand-soft: #EBF0FE;
    --success: #16A34A;
    --success-soft: #E8F7EE;
    --warning: #D97706;
    --warning-soft: #FBF0DF;
    --danger: #DC2626;
    --bg: #FAFAFA;
    --surface: #FFFFFF;
    --surface-2: #F4F4F5;
    --border: #E4E4E7;
    --text-1: #18181B;
    --text-2: #52525B;
    --text-3: #A1A1AA;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    --sans: system-ui, "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text-1);
    font-size: 13px;
    line-height: 20px;
    display: flex;
    min-height: 100vh;
  }

  /* ===== 左侧导航 ===== */
  .sidebar {
    width: 136px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 12px 10px;
  }
  .side-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px 16px;
  }
  .side-logo .logo {
    width: 20px; height: 20px;
    background: var(--brand);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .side-logo .app-name { font-size: 14px; font-weight: 600; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    height: 34px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 10px;
    border-radius: 6px;
    font-size: 13px;
    color: var(--text-2);
    cursor: pointer;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--text-1); }
  .nav-item.active {
    background: var(--brand-soft);
    color: var(--brand);
    font-weight: 600;
  }

  /* ===== 主内容区 ===== */
  .main { flex: 1; min-width: 0; }
  .container { max-width: 720px; margin: 0 auto; padding: 24px; }

  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 24px;
    margin-top: 24px;
  }
  .form-card:first-child { margin-top: 0; }
  .section-title { font-size: 15px; font-weight: 600; line-height: 24px; margin-bottom: 16px; }

  .btn {
    height: 32px;
    padding: 0 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    border: 1px solid transparent;
    font-family: var(--sans);
    transition: background .15s, transform .1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-hover); }
  .btn-default { background: var(--surface); border-color: var(--border); color: var(--text-1); }
  .btn-default:hover { background: var(--surface-2); }

  /* 状态行 */
  .status-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 0 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .status-row:last-of-type { border-bottom: none; margin-bottom: 0; padding-bottom: 4px; }
  .status-icon {
    width: 36px; height: 36px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .status-icon.success { background: var(--success-soft); color: var(--success); }
  .status-icon.brand { background: var(--brand-soft); color: var(--brand); }
  .status-main { flex: 1; min-width: 0; }
  .status-label { font-size: 13px; font-weight: 600; }
  .status-label .mono { font-family: var(--mono); font-weight: 600; }
  .status-desc { font-size: 12px; color: var(--text-2); margin-top: 2px; }

  /* 表单 */
  .form-row { margin-bottom: 16px; }
  .form-row:last-child { margin-bottom: 0; }
  .form-label { font-size: 12px; color: var(--text-2); margin-bottom: 6px; }
  .input-wrap { display: flex; gap: 8px; align-items: center; }
  .input {
    height: 32px;
    flex: 1;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 12px;
    font-size: 13px;
    color: var(--text-1);
    display: flex;
    align-items: center;
    font-family: var(--sans);
  }
  .input .mono { font-family: var(--mono); }
  .input .suffix-icon {
    margin-left: auto;
    color: var(--text-3);
    display: flex;
    cursor: pointer;
  }
  .input .suffix-icon:hover { color: var(--text-2); }
  .input.w-fixed { flex: none; width: 120px; }
  .form-tip { font-size: 12px; color: var(--text-3); margin-top: 6px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

  /* 运行状态徽标 */
  .run-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 24px;
    padding: 0 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    background: var(--success-soft);
    color: var(--success);
  }
  .run-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
</style>
</head>
<body>

<!-- 左侧导航 -->
<aside class="sidebar">
  <div class="side-logo">
    <div class="logo">
      <svg width="11" height="11" viewBox="0 0 10 10" fill="none">
        <path d="M5 1v5M5 6L2.5 3.8M5 6l2.5-2.2M2 8h6" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="app-name">AriaDesk</span>
  </div>
  <nav class="nav">
    <div class="nav-item">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M3 7l5-4.5L13 7M4.5 6v6h7V6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      首页
    </div>
    <div class="nav-item active">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M2 4.5h12M2 8h12M2 11.5h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="5" cy="4.5" r="1.6" fill="var(--surface)" stroke="currentColor" stroke-width="1.2"/>
        <circle cx="10" cy="8" r="1.6" fill="var(--surface)" stroke="currentColor" stroke-width="1.2"/>
        <circle cx="6.5" cy="11.5" r="1.6" fill="var(--surface)" stroke="currentColor" stroke-width="1.2"/>
      </svg>
      管理
    </div>
    <div class="nav-item">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.3"/>
        <path d="M8 1.8v1.7M8 12.5v1.7M1.8 8h1.7M12.5 8h1.7M3.6 3.6l1.2 1.2M11.2 11.2l1.2 1.2M12.4 3.6l-1.2 1.2M4.8 11.2l-1.2 1.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      设置
    </div>
  </nav>
</aside>

<!-- 主内容区 -->
<main class="main">
<div class="container">

  <!-- aria2 状态 -->
  <div class="form-card">
    <div class="section-title">aria2</div>

    <div class="status-row">
      <div class="status-icon success">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.4"/>
          <path d="M6 9.2l2 2 4-4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="status-main">
        <div class="status-label">已安装 aria2 <span class="mono">1.36.0</span></div>
        <div class="status-desc">通过 winget 安装，路径已缓存</div>
      </div>
      <div class="run-badge"><span class="dot"></span>运行中</div>
    </div>

    <div class="status-row">
      <div class="status-icon brand">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M4 9a5 5 0 015-5h5M14 9a5 5 0 01-5 5H4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M12.6 2.4L15 4l-2.4 1.6M5.4 15.6L3 14l2.4-1.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="status-main">
        <div class="status-label">进程控制</div>
        <div class="status-desc">随应用启动已开启，监听端口 <span class="mono">6800</span></div>
      </div>
      <button class="btn btn-default">停止</button>
    </div>
  </div>

  <!-- RPC -->
  <div class="form-card">
    <div class="section-title">RPC</div>

    <div class="form-row">
      <div class="form-label">RPC 密钥 (Token)</div>
      <div class="input-wrap">
        <div class="input">
          <span class="mono">&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;</span>
          <span class="suffix-icon">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M1.5 7s2.2-3.5 5.5-3.5S12.5 7 12.5 7 10.3 10.5 7 10.5 1.5 7 1.5 7z" stroke="currentColor" stroke-width="1.2"/>
              <circle cx="7" cy="7" r="1.8" stroke="currentColor" stroke-width="1.2"/>
            </svg>
          </span>
        </div>
        <button class="btn btn-default">重新生成</button>
      </div>
      <div class="form-tip">保存在 %APPDATA%\AriaDesk\token.pass，已加密存储</div>
    </div>

    <div class="form-row">
      <div class="form-label">RPC 端口</div>
      <div class="input-wrap">
        <div class="input w-fixed"><span class="mono">6800</span></div>
      </div>
      <div class="form-tip">修改后需重启 aria2 生效</div>
    </div>
  </div>

  <!-- 下载 -->
  <div class="form-card">
    <div class="section-title">下载</div>

    <div class="form-row">
      <div class="form-label">默认下载目录</div>
      <div class="input-wrap">
        <div class="input"><span>C:\Users\Administrator\Downloads</span></div>
        <button class="btn btn-default">浏览…</button>
      </div>
      <div class="form-tip">保存时校验目录存在且可写，仅影响之后新建的任务</div>
    </div>

    <div class="form-actions">
      <button class="btn btn-primary">保存修改</button>
    </div>
  </div>

</div>
</main>

</body>
</html>
